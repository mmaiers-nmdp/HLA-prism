[project]
name = "hla-prism"
version = "0.1.0"
description = "Block graph of HLA protein alleles: represent alleles as paths through variable-length sequence blocks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "rapidfuzz>=3.0",
]

[project.scripts]
hla-graph = "hla_graph:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hla_graph.py"]

[tool.uv]
package = true
